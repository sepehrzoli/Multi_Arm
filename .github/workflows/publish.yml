name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.2)"
        required: true
        default: "v0.1.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c 'import os, best_arm; assert os.environ["RELEASE_TAG"] == "v" + best_arm.__version__'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Install and test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import pathlib, best_arm; assert "site-packages" in pathlib.Path(best_arm.__file__).parts'
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/best-arm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
