name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify release version
        run: |
          python -c 'import os, best_arm; assert os.environ["GITHUB_REF_NAME"] == "v" + best_arm.__version__'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Install and test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import pathlib, best_arm; assert "site-packages" in pathlib.Path(best_arm.__file__).parts'
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish versioned wheel and source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Multi_Arm $GITHUB_REF_NAME" --notes-from-tag
