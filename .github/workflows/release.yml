name: GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish or retry"
        required: true
        default: "v0.1.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Verify release version
        run: |
          python -c 'import os, best_arm; assert os.environ["RELEASE_TAG"] == "v" + best_arm.__version__'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Install and test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import pathlib, best_arm; assert "site-packages" in pathlib.Path(best_arm.__file__).parts'
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish versioned wheel and source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Multi_Arm $RELEASE_TAG" --generate-notes
